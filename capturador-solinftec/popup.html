<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="popup.css"><title>Novo mapa</title></head><body>
<header><span>C</span><div><b>NOVO MAPA</b><small>CAPTURADOR SOLINFTEC</small></div></header>
<label>Operação<input id="operation" list="operations" placeholder="Ex.: Plantio de Cana" autofocus><datalist id="operations"><option value="Plantio de Cana"><option value="Adubação NPK"><option value="Cultivo"><option value="Correção de Solo"><option value="Pré-Emergente"></datalist></label>
<div class="grid"><label>Setor<input id="sector" placeholder="Ex.: J2"></label><label>Turno<input id="shift" value="C" maxlength="3"></label></div>
<div class="grid"><label>Tipo do mapa<select id="mapType"><option>Velocidade</option><option>Vazão</option><option>Área Trabalhada</option></select></label><label>Data<input id="period" type="date"></label></div>
<section class="fleets"><div class="sectionTitle"><b>Frotas e médias</b><button id="addFleet">＋ Adicionar</button></div><div id="fleetRows"></div></section>
<label class="check"><input id="related" type="checkbox" checked disabled> Criar pacote completo: velocidade, vazão e áreas trabalhadas</label>
<section class="shot"><div id="shotEmpty"><b>Print ainda não capturado</b><small>Deixe o mapa como deseja enviar</small></div><img id="shotPreview" hidden></section>
<button id="take" class="secondary">▣ Tirar print agora</button><button id="send" disabled>Confirmar mapa e enviar para a Central</button><p id="status">Preencha os dados e tire o print.</p>
<div id="pad" class="pad" hidden><div class="padBox"><small>MÉDIA DA FROTA</small><b id="padFleet"></b><strong id="padValue">0,00</strong><div id="digits"></div><div class="padActions"><button id="clear">Limpar</button><button id="confirmPad">Confirmar</button></div></div></div>
<script src="popup.js"></script></body></html>
